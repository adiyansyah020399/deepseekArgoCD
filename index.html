<!DOCTYPE html>
<html>
<head>
<title>DevOps GitOps Demo</title>
<style>
body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 50px;
}
h1 { font-size: 3em; }
.container {
    background: rgba(0,0,0,0.7);
    border-radius: 10px;
    padding: 30px;
    display: inline-block;
}
</style>
</head>
<body>
<div class="container">
    <h1>🚀 GitOps dengan ArgoCD</h1>
    <h2>Deployed via Git + ArgoCD!</h2>
    <p>Auto-sync: ✅ Enabled</p>
    <p>Last deployment: <span id="time"></span></p>
    <p>Replicas: 3 (scaled via Git commit)</p>
</div>
<script>
document.getElementById('time').innerHTML = new Date().toLocaleString();
</script>
</body>
</html>
